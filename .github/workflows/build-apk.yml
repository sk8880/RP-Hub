name: Build RP-Hub APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare web files into www/
        run: |
          mkdir -p www
          cp index.html www/
          cp -r assets www/
          cp -r character www/ 2>/dev/null || true
          cp -r novel www/ 2>/dev/null || true
          cp CNAME www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli
          npx cap init RPHub com.sk8880.rphub --web-dir=www

      - name: Add Android platform
        run: |
          npm i @capacitor/android
          npx cap add android
          npx cap sync

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Fix AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import re, os
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                         s, count=1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application",
                            '<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config"', 1)
          open(p, "w").write(s)
          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          open("android/app/src/main/res/xml/network_security_config.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '    <base-config cleartextTrafficPermitted="true">\n'
              '        <trust-anchors>\n'
              '            <certificates src="system" />\n'
              '        </trust-anchors>\n'
              '    </base-config>\n'
              '</network-security-config>\n')
          print("manifest patched")
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: rphub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
