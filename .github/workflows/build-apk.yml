name: Build RP-Hub APK

# APK 版本号自动跟随源码，无需改动本工作流：
#   versionName <- assets/js/built-in-content.js 中更新公告标题 "### RP-Hub X.Y.Z"
#   versionCode <- 同文件 window.RPHubLatestUpdate.id（五位递增数字 ID）
# 发布新版本时，只需修改源码里的这两处，重新运行工作流即可。

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Read version from source code
        id: version
        run: |
          python3 - <<'PY'
          import os, re, glob, sys

          # 版本号以源码自带的更新公告为唯一来源：
          #   ### RP-Hub 2.0.6   -> versionName（用户可见语义版本）
          #   id: 10226          -> versionCode（五位递增整数，与 presence-server 同源）
          candidates = [
              "assets/js/built-in-content.js",
              "www/assets/js/built-in-content.js",
          ]
          src = next((p for p in candidates if os.path.isfile(p)), None)
          if src is None:
              hits = glob.glob("**/built-in-content.js", recursive=True)
              src = hits[0] if hits else None
          if src is None:
              sys.exit("!! 找不到 built-in-content.js，无法读取源码版本号")

          s = open(src, encoding="utf-8", errors="ignore").read()

          m_name = re.search(
              r"^[ \t]*#{3}[ \t]*RP-Hub[ \t]+v?(\d+(?:\.\d+){1,3}(?:[-+][0-9A-Za-z.\-]+)?)[ \t\r]*$",
              s, flags=re.M | re.I)
          m_code = re.search(
              r"window\.RPHubLatestUpdate\s*=\s*Object\.freeze\(\s*\{\s*id\s*:\s*(\d{5})\b",
              s)
          if not m_name or not m_code:
              sys.exit("!! 版本号解析失败：需要 '### RP-Hub X.Y.Z' 与 'RPHubLatestUpdate.id: NNNNN'")

          name = m_name.group(1)
          code = int(m_code.group(1))
          if not 0 < code <= 2100000000:
              sys.exit("!! versionCode 超出 Android 允许范围: %d" % code)

          print("源码版本 (%s): versionName=%s  versionCode=%d" % (src, name, code))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("version_name=%s\n" % name)
              f.write("version_code=%d\n" % code)
              f.write("apk_name=RP-Hub-%s.apk\n" % name)
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare web files into www/
        run: |
          mkdir -p www
          tar --exclude=./www --exclude=./.git --exclude=./.github -cf - . | (cd www && tar -xf -)
          ls -la www

      - name: Fix absolute paths to relative
        run: |
          cd www
          grep -rl '="/' . --include=*.html --include=*.js 2>/dev/null | while read f; do
            sed -i 's|="/assets|="./assets|g; s|="/character|="./character|g; s|="/novel|="./novel|g; s|="/data|="./data|g' "$f"
          done
          echo "paths patched"

      - name: Vendor external CDN resources into app (offline-proof)
        run: |
          python3 - <<'PY'
          import os, re, glob, hashlib, urllib.request, urllib.parse

          root = "www"
          vdir = os.path.join(root, "_vendor")
          os.makedirs(vdir, exist_ok=True)
          UA = {"User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36"}
          total = 0

          def dl(url):
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.read()
              except Exception as e:
                  print("  !! 下载失败:", url, "->", e)
                  return None

          def fname(url, kind):
              h = hashlib.md5(url.encode("utf-8")).hexdigest()[:10]
              base = os.path.basename(urllib.parse.urlparse(url).path) or ("res." + kind)
              base = re.sub(r"[^A-Za-z0-9._-]", "_", base)[:50]
              if "." not in base:
                  base = base + "." + kind
              return h + "_" + base

          def fix_css(data, base_url):
              try:
                  txt = data.decode("utf-8", "ignore")
              except Exception:
                  return data
              def rep(m):
                  u = m.group(1).strip()
                  if not u or u.startswith("data:"):
                      return m.group(0)
                  absu = urllib.parse.urljoin(base_url, u)
                  if not absu.startswith("http"):
                      return m.group(0)
                  d = dl(absu)
                  if d is None:
                      return m.group(0)
                  n = fname(absu, "woff2")
                  open(os.path.join(vdir, n), "wb").write(d)
                  return "url(%s)" % n
              return re.sub(r"url\(\s*['\"]?([^'\")]+)['\"]?\s*\)", rep, txt).encode("utf-8")

          for dp, dns, fns in os.walk(root):
              if os.path.abspath(dp).startswith(os.path.abspath(vdir)):
                  continue
              for fn in fns:
                  if not fn.endswith((".html", ".htm")):
                      continue
                  path = os.path.join(dp, fn)
                  rel = os.path.relpath(vdir, dp).replace(os.sep, "/")
                  s = open(path, encoding="utf-8", errors="ignore").read()
                  orig = s

                  def repl_script(m):
                      global total
                      url = m.group(2)
                      d = dl(url)
                      if d is None:
                          return m.group(0)
                      n = fname(url, "js")
                      open(os.path.join(vdir, n), "wb").write(d)
                      total += 1
                      return m.group(1) + rel + "/" + n + m.group(3)

                  s = re.sub(r'(<script[^>]*?\ssrc\s*=\s*")(https?://[^"]+)(")', repl_script, s, flags=re.I)

                  def repl_link(m):
                      global total
                      tag, url, q = m.group(1), m.group(2), m.group(3)
                      low = tag.lower()
                      if "stylesheet" not in low and "preload" not in low:
                          return m.group(0)
                      d = dl(url)
                      if d is None:
                          return m.group(0)
                      if "stylesheet" in low:
                          d = fix_css(d, url)
                      n = fname(url, "css")
                      open(os.path.join(vdir, n), "wb").write(d)
                      total += 1
                      return tag + rel + "/" + n + q

                  s = re.sub(r'(<link[^>]*?\shref\s*=\s*")(https?://[^"]+)(")', repl_link, s, flags=re.I)

                  if s != orig:
                      open(path, "w", encoding="utf-8").write(s)
                      print("  已本地化外部资源:", path)

          print("共本地化资源数:", total)
          print("_vendor 内容:", [os.path.basename(p) for p in sorted(glob.glob(os.path.join(vdir, "*")))])
          idx = os.path.join(root, "index.html")
          if os.path.exists(idx):
              t = open(idx, encoding="utf-8", errors="ignore").read()
              print("index.html 中是否还有外网 script/link:", bool(re.search(r'(?:src|href)="https?://', t)))
              for m in re.finditer(r'<script[^>]*src="([^"]+)"', t):
                  print("  script ->", m.group(1))
          PY

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli
          npx cap init RPHub com.sk8880.rphub --web-dir=www

      - name: Add Android platform
        run: |
          npm i @capacitor/android
          npx cap add android
          npx cap sync

      - name: Apply source version to Android build.gradle
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, re, sys, json

          name = os.environ["VERSION_NAME"]
          code = int(os.environ["VERSION_CODE"])
          p = "android/app/build.gradle"
          if not os.path.isfile(p):
              sys.exit("!! 找不到 " + p)

          s = open(p, encoding="utf-8").read()
          s2, n1 = re.subn(r"(\bversionCode\s*=?\s*)\d+",
                           lambda m: m.group(1) + str(code), s, count=1)
          s2, n2 = re.subn(r"(\bversionName\s*=?\s*)(['\x22])[^'\x22]*\2",
                           lambda m: m.group(1) + json.dumps(name), s2, count=1)
          if n1 and n2:
              open(p, "w", encoding="utf-8").write(s2)
              print("已原地替换 defaultConfig 中的版本号")
          else:
              with open(p, "a", encoding="utf-8") as f:
                  f.write("\n// 由 CI 依据源码版本自动注入\n")
                  f.write("android.defaultConfig { versionCode %d; versionName %s }\n"
                          % (code, json.dumps(name)))
              print("未匹配到默认版本号，已追加覆盖配置")
          print("=> versionCode=%d  versionName=%s" % (code, name))
          PY

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Setup fixed signing keystore
        run: |
          KS=".github/rphub-signing.b64"
          if [ -f "$KS" ] && [ -s "$KS" ]; then
            base64 -d "$KS" > /tmp/rphub.jks
            echo "using existing keystore"
          else
            keytool -genkeypair -v \
              -keystore /tmp/rphub.jks \
              -alias rphub \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass rphub2026 -keypass rphub2026 \
              -dname "CN=RPHub, OU=Self, O=Self, L=Unknown, S=Unknown, C=CN"
            mkdir -p .github
            base64 -w0 /tmp/rphub.jks > "$KS"
            echo "generated new keystore"
          fi
          cat >> android/app/build.gradle << 'EOF'

          android.signingConfigs {
              rphubRelease {
                  storeFile file("/tmp/rphub.jks")
                  storePassword "rphub2026"
                  keyAlias "rphub"
                  keyPassword "rphub2026"
                  v1SigningEnabled true
                  v2SigningEnabled true
              }
          }
          android.buildTypes.release {
              signingConfig android.signingConfigs.rphubRelease
          }
          android.buildTypes.debug {
              signingConfig android.signingConfigs.rphubRelease
          }
          EOF
          echo "signing config injected"

      - name: Persist keystore back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/rphub-signing.b64
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist signing keystore [skip ci]"
            git push || echo "push failed"
          else
            echo "keystore unchanged"
          fi

      - name: Fix AndroidManifest.xml (permissions + edge-to-edge)
        run: |
          python3 - <<'PY'
          import re, os
          cs = 0
          vg = "android/variables.gradle"
          if os.path.exists(vg):
              t = open(vg).read()
              m = re.search(r'compileSdkVersion\s*=\s*(\d+)', t) or re.search(r'compileSdk\s*=\s*(\d+)', t)
              if m:
                  cs = int(m.group(1))
          print("compileSdkVersion:", cs)

          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          for perm in ['android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE']:
              if perm not in s:
                  s = re.sub(r'(<manifest[^>]*>)',
                             r'\1\n    <uses-permission android:name="%s" />' % perm, s, count=1)
          if 'READ_EXTERNAL_STORAGE' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
                         s, count=1)
          if 'WRITE_EXTERNAL_STORAGE' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
                         s, count=1)
          if 'usesCleartextTraffic' not in s:
              attrs = 'android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"'
              if cs >= 35:
                  attrs += ' android:windowOptOutEdgeToEdgeEnforcement="true"'
              attrs += ' android:networkSecurityConfig="@xml/network_security_config"'
              s = s.replace("<application", '<application ' + attrs, 1)
          open(p, "w", encoding="utf-8").write(s)

          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          open("android/app/src/main/res/xml/network_security_config.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '    <base-config cleartextTrafficPermitted="true">\n'
              '        <trust-anchors>\n'
              '            <certificates src="system" />\n'
              '        </trust-anchors>\n'
              '    </base-config>\n'
              '</network-security-config>\n')
          print("manifest patched")
          PY

      - name: Write custom MainActivity (export/import support)
        run: |
          mkdir -p android/app/src/main/java/com/sk8880/rphub
          cat > android/app/src/main/java/com/sk8880/rphub/MainActivity.java << 'EOF'
          package com.sk8880.rphub;

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.MimeTypeMap;
          import android.webkit.URLUtil;
          import android.webkit.WebView;
          import android.widget.Toast;

          import com.getcapacitor.BridgeActivity;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {

              private WebView webViewRef;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestStoragePermission();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  setupDownload();
              }

              private void requestStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      return;
                  }
                  if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                              Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE
                      }, 1001);
                  }
              }

              private void setupDownload() {
                  try {
                      WebView wv = findViewById(com.getcapacitor.android.R.id.webview);
                      if (wv == null) {
                          return;
                      }
                      webViewRef = wv;
                      wv.getSettings().setJavaScriptEnabled(true);
                      wv.getSettings().setDomStorageEnabled(true);
                      wv.getSettings().setAllowFileAccess(true);
                      wv.getSettings().setAllowContentAccess(true);
                      wv.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void saveBase64(final String data, final String fileName, final String mimeType) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      saveFile(data, fileName, mimeType);
                                  }
                              });
                          }
                      }, "AndroidDownloader");

                      wv.setDownloadListener(new android.webkit.DownloadListener() {
                          @Override
                          public void onDownloadStart(final String url, String userAgent,
                                                      String contentDisposition,
                                                      String mimeType, long contentLength) {
                              if (url == null) {
                                  return;
                              }
                              String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              String mt = (mimeType == null || mimeType.isEmpty()) ? "*/*" : mimeType;
                              if (url.startsWith("blob:")) {
                                  fetchBlob(url, fileName, mt);
                              } else if (url.startsWith("data:")) {
                                  int idx = url.indexOf(',');
                                  if (idx >= 0) {
                                      saveFile(url.substring(idx + 1), fileName, mt);
                                  }
                              } else {
                                  downloadByManager(url, fileName, mt);
                              }
                          }
                      });
                  } catch (Exception e) {
                      Toast.makeText(this, "init fail: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void fetchBlob(final String blobUrl, String fileName, String mimeType) {
                  final String fn = safe(fileName);
                  final String mt = safe(mimeType);
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String js = "javascript:(function(){"
                                      + "var xhr=new XMLHttpRequest();"
                                      + "xhr.open('GET','" + blobUrl + "',true);"
                                      + "xhr.responseType='blob';"
                                      + "xhr.onload=function(){if(xhr.status===200){var r=new FileReader();"
                                      + "r.onloadend=function(){var s=r.result;var i=s.indexOf(',');if(i>=0)s=s.substring(i+1);"
                                      + "if(typeof AndroidDownloader!=='undefined'){AndroidDownloader.saveBase64(s,'" + fn + "','" + mt + "');}};"
                                      + "r.readAsDataURL(xhr.response);}};"
                                      + "xhr.send();})()";
                              webViewRef.evaluateJavascript(js, null);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "导出失败: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      }
                  });
              }

              private static String safe(String s) {
                  if (s == null) {
                      return "";
                  }
                  return s.replace("\\", "\\\\").replace("'", "\\'");
              }

              private void downloadByManager(String url, String fileName, String mimeType) {
                  try {
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      req.setMimeType(mimeType);
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "RP-Hub/" + fileName);
                      req.allowScanningByMediaScanner();
                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      if (dm != null) {
                          dm.enqueue(req);
                          Toast.makeText(this, "已开始下载: " + fileName, Toast.LENGTH_SHORT).show();
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "下载失败: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void saveFile(String base64Data, String fileName, String mimeType) {
                  try {
                      if (base64Data == null || base64Data.length() == 0) {
                          throw new Exception("数据为空");
                      }
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      String name = fileName;
                      if (name == null || name.isEmpty() || name.equals("download") || name.equals("downloadfile")) {
                          String ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mimeType);
                          name = "rphub_" + System.currentTimeMillis() + (ext != null ? "." + ext : ".json");
                      }
                      OutputStream os;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          cv.put(MediaStore.Downloads.MIME_TYPE, mimeType != null ? mimeType : "*/*");
                          cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/RP-Hub");
                          cv.put(MediaStore.Downloads.IS_PENDING, 1);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          if (uri == null) {
                              throw new Exception("无法创建文件");
                          }
                          os = getContentResolver().openOutputStream(uri);
                          cv.clear();
                          cv.put(MediaStore.Downloads.IS_PENDING, 0);
                          getContentResolver().update(uri, cv, null, null);
                      } else {
                          File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "RP-Hub");
                          if (!dir.exists()) {
                              dir.mkdirs();
                          }
                          File f = new File(dir, name);
                          os = new FileOutputStream(f);
                      }
                      os.write(bytes);
                      os.flush();
                      os.close();
                      Toast.makeText(this, "已保存: 下载/RP-Hub/" + name, Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "保存失败: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Tag APK with source version
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/$APK_NAME"
          echo "APK: $APK_NAME  (versionName=$VERSION_NAME, versionCode=$VERSION_CODE)"
          {
            echo "### 构建版本（跟随源码自动更新）"
            echo ""
            echo "- versionName: $VERSION_NAME"
            echo "- versionCode: $VERSION_CODE"
            echo "- 产物: $APK_NAME"
            echo "- 版本来源: assets/js/built-in-content.js 中的 '### RP-Hub X.Y.Z' 与 'id: NNNNN'"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: rphub-apk-${{ steps.version.outputs.version_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
