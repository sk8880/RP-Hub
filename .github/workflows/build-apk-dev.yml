name: Build RP-Hub APK (Dev)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: dev-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Detect and extract dev source ZIP
        run: |
          python3 - <<'PY'
          import re, zipfile, shutil
          from pathlib import Path, PurePosixPath
          candidates = [p for p in Path('.').iterdir() if p.is_file() and p.suffix.lower() == '.zip' and 'dev' in p.name.lower()]
          if not candidates:
              raise SystemExit('仓库根目录没有文件名包含 dev 的 ZIP，请上传 RP-Hub-dev-0.1.3.zip 等源码包')
          def version(p):
              m = re.search(r'(?i)dev[-_ ]*v?(\d+)\.(\d+)\.(\d+)', p.stem)
              return tuple(map(int, m.groups())) if m else (-1, -1, -1)
          candidates.sort(key=lambda p: (version(p), p.name.lower()), reverse=True)
          source = candidates[0]
          print('Selected dev ZIP:', source, '; candidates:', [p.name for p in candidates])
          target = Path('/tmp/rphub-dev-source')
          if target.exists(): shutil.rmtree(target)
          target.mkdir()
          with zipfile.ZipFile(source) as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in item.filename or ((item.external_attr >> 16) & 0o170000) == 0o120000:
                      raise SystemExit('ZIP 存在不安全路径: ' + item.filename)
              z.extractall(target)
          roots = [p.parent for p in target.rglob('index.html') if (p.parent / 'assets/js/app.js').is_file()]
          if len(roots) != 1:
              raise SystemExit('不能唯一识别 RP-Hub 入口（需 index.html + assets/js/app.js）: ' + str(roots))
          dest = Path('www')
          if dest.exists(): shutil.rmtree(dest)
          shutil.copytree(roots[0], dest)
          print('Source root:', roots[0])
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Fix absolute paths to relative
        run: |
          cd www
          grep -rl '="/' . --include=*.html --include=*.js 2>/dev/null | while read f; do
            sed -i 's|="/assets|="./assets|g; s|="/character|="./character|g; s|="/novel|="./novel|g; s|="/data|="./data|g' "$f"
          done
          echo "paths patched"

      - name: Vendor external CDN resources into app (offline-proof)
        run: |
          python3 - <<'PY'
          import os, re, glob, hashlib, urllib.request, urllib.parse

          root = "www"
          vdir = os.path.join(root, "_vendor")
          os.makedirs(vdir, exist_ok=True)
          UA = {"User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36"}
          total = 0

          def dl(url):
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.read()
              except Exception as e:
                  print("  !! 下载失败:", url, "->", e)
                  return None

          def fname(url, kind):
              h = hashlib.md5(url.encode("utf-8")).hexdigest()[:10]
              base = os.path.basename(urllib.parse.urlparse(url).path) or ("res." + kind)
              base = re.sub(r"[^A-Za-z0-9._-]", "_", base)[:50]
              if "." not in base:
                  base = base + "." + kind
              return h + "_" + base

          def fix_css(data, base_url):
              try:
                  txt = data.decode("utf-8", "ignore")
              except Exception:
                  return data
              def rep(m):
                  u = m.group(1).strip()
                  if not u or u.startswith("data:"):
                      return m.group(0)
                  absu = urllib.parse.urljoin(base_url, u)
                  if not absu.startswith("http"):
                      return m.group(0)
                  d = dl(absu)
                  if d is None:
                      return m.group(0)
                  n = fname(absu, "woff2")
                  open(os.path.join(vdir, n), "wb").write(d)
                  return "url(%s)" % n
              return re.sub(r"url\(\s*['\"]?([^'\")]+)['\"]?\s*\)", rep, txt).encode("utf-8")

          for dp, dns, fns in os.walk(root):
              if os.path.abspath(dp).startswith(os.path.abspath(vdir)):
                  continue
              for fn in fns:
                  if not fn.endswith((".html", ".htm")):
                      continue
                  path = os.path.join(dp, fn)
                  rel = os.path.relpath(vdir, dp).replace(os.sep, "/")
                  s = open(path, encoding="utf-8", errors="ignore").read()
                  orig = s

                  def repl_script(m):
                      global total
                      url = m.group(2)
                      d = dl(url)
                      if d is None:
                          return m.group(0)
                      n = fname(url, "js")
                      open(os.path.join(vdir, n), "wb").write(d)
                      total += 1
                      return m.group(1) + rel + "/" + n + m.group(3)

                  s = re.sub(r'(<script[^>]*?\ssrc\s*=\s*")(https?://[^"]+)(")', repl_script, s, flags=re.I)

                  def repl_link(m):
                      global total
                      tag, url, q = m.group(1), m.group(2), m.group(3)
                      low = tag.lower()
                      if "stylesheet" not in low and "preload" not in low:
                          return m.group(0)
                      d = dl(url)
                      if d is None:
                          return m.group(0)
                      if "stylesheet" in low:
                          d = fix_css(d, url)
                      n = fname(url, "css")
                      open(os.path.join(vdir, n), "wb").write(d)
                      total += 1
                      return tag + rel + "/" + n + q

                  s = re.sub(r'(<link[^>]*?\shref\s*=\s*")(https?://[^"]+)(")', repl_link, s, flags=re.I)

                  if s != orig:
                      open(path, "w", encoding="utf-8").write(s)
                      print("  已本地化外部资源:", path)

          print("共本地化资源数:", total)
          print("_vendor 内容:", [os.path.basename(p) for p in sorted(glob.glob(os.path.join(vdir, "*")))])
          idx = os.path.join(root, "index.html")
          if os.path.exists(idx):
              t = open(idx, encoding="utf-8", errors="ignore").read()
              print("index.html 中是否还有外网 script/link:", bool(re.search(r'(?:src|href)="https?://', t)))
              for m in re.finditer(r'<script[^>]*src="([^"]+)"', t):
                  print("  script ->", m.group(1))
          PY

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli
          npx cap init "RP-Hub Dev" com.sk8880.rphub.dev --web-dir=www

      - name: Add Android platform
        run: |
          npm i @capacitor/android
          npx cap add android
          npx cap sync

      - name: Sync Dev version from source
        run: |
          python3 - <<'PY'
          import re, os
          from pathlib import Path
          root = Path('www')
          source_version = (root / 'VERSION').read_text().strip() if (root / 'VERSION').exists() else ''
          if not source_version:
              html = (root / 'index.html').read_text(encoding='utf-8')
              m = re.search(r'<meta\s+name=["\']rphub-dev-version["\']\s+content=["\'](\d+\.\d+\.\d+)["\']', html)
              if not m: m = re.search(r'(?i)\bdev\s+v?(\d+\.\d+\.\d+)', html)
              if m: source_version = m.group(1)
          if not re.fullmatch(r'\d+\.\d+\.\d+', source_version):
              raise SystemExit('缺少有效 Dev 版本号，请提供 VERSION 或 rphub-dev-version meta')
          major, minor, patch = map(int, source_version.split('.'))
          if minor >= 100 or patch >= 100: raise SystemExit('minor/patch 必须小于100')
          code = major * 10000 + minor * 100 + patch
          if not 0 < code <= 2100000000: raise SystemExit('versionCode 超出范围')
          p = Path('android/app/build.gradle'); text = p.read_text()
          text, a = re.subn(r'(\bversionCode\s+)\d+', lambda m: m[1]+str(code), text, count=1)
          text, b = re.subn(r'(\bversionName\s+)["\'][^"\']*["\']', lambda m: m[1]+'"'+source_version+'"', text, count=1)
          if a != 1 or b != 1: raise SystemExit('无法同步 Gradle 版本')
          p.write_text(text)
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEV_VERSION='+source_version+'\n')
          print('versionName:',source_version,'versionCode:',code)
          PY

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Use existing signing keystore from repository
        run: |
          set -euo pipefail
          KS=".github/rphub-signing.b64"
          if [ ! -s "$KS" ]; then
            echo "::error::仓库缺少 .github/rphub-signing.b64，请将 dev 使用的原签名文件复制到当前 dev 分支。不会自动生成新签名。"
            exit 1
          fi
          base64 --decode "$KS" > "$RUNNER_TEMP/rphub-dev.jks"
          keytool -list -keystore "$RUNNER_TEMP/rphub-dev.jks" -storepass rphub2026 -alias rphub > /dev/null
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  devRelease {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/rphub-dev.jks")
                      storePassword "rphub2026"
                      keyAlias "rphub"
                      keyPassword "rphub2026"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.devRelease }
              }
          }
          EOF

      - name: Fix AndroidManifest.xml (permissions + edge-to-edge)
        run: |
          python3 - <<'PY'
          import re, os
          cs = 0
          vg = "android/variables.gradle"
          if os.path.exists(vg):
              t = open(vg).read()
              m = re.search(r'compileSdkVersion\s*=\s*(\d+)', t) or re.search(r'compileSdk\s*=\s*(\d+)', t)
              if m:
                  cs = int(m.group(1))
          print("compileSdkVersion:", cs)

          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          for perm in ['android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE']:
              if perm not in s:
                  s = re.sub(r'(<manifest[^>]*>)',
                             r'\1\n    <uses-permission android:name="%s" />' % perm, s, count=1)
          if 'READ_EXTERNAL_STORAGE' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
                         s, count=1)
          if 'WRITE_EXTERNAL_STORAGE' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
                         s, count=1)
          if 'usesCleartextTraffic' not in s:
              attrs = 'android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"'
              if cs >= 35:
                  attrs += ' android:windowOptOutEdgeToEdgeEnforcement="true"'
              attrs += ' android:networkSecurityConfig="@xml/network_security_config"'
              s = s.replace("<application", '<application ' + attrs, 1)
          open(p, "w", encoding="utf-8").write(s)

          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          open("android/app/src/main/res/xml/network_security_config.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '    <base-config cleartextTrafficPermitted="true">\n'
              '        <trust-anchors>\n'
              '            <certificates src="system" />\n'
              '        </trust-anchors>\n'
              '    </base-config>\n'
              '</network-security-config>\n')
          print("manifest patched")
          PY

      - name: Write custom MainActivity (import + export + persistence)
        run: |
          mkdir -p android/app/src/main/java/com/sk8880/rphub/dev
          cat > android/app/src/main/java/com/sk8880/rphub/dev/MainActivity.java << 'EOF'
          package com.sk8880.rphub.dev;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.MimeTypeMap;
          import android.webkit.URLUtil;
          import android.webkit.WebView;
          import android.widget.Toast;

          import com.getcapacitor.BridgeActivity;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {

              private static final int REQ_PICK_FILE = 2001;
              private static final int REQ_SAVE_FILE = 2002;
              private static final int REQ_STORAGE_PERM = 1001;
              private static final long MAX_PICK_BYTES = 64L * 1024 * 1024;

              private WebView webViewRef;

              private String pendingSaveName;
              private String pendingSaveMime;
              private String pendingSaveData;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestStoragePermission();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  setupWebView();
              }

              /* ---------------- permissions ---------------- */

              private void requestStoragePermission() {
                  // Android 13+ 走 SAF 选择器，不需要任何存储权限
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      return;
                  }
                  List<String> need = new ArrayList<String>();
                  if (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                  }
                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                  }
                  if (!need.isEmpty()) {
                      requestPermissions(need.toArray(new String[0]), REQ_STORAGE_PERM);
                  }
              }

              /* ---------------- webview / js bridge ---------------- */

              private void setupWebView() {
                  try {
                      WebView wv = findViewById(com.getcapacitor.android.R.id.webview);
                      if (wv == null) {
                          return;
                      }
                      webViewRef = wv;
                      wv.getSettings().setJavaScriptEnabled(true);
                      // 保证 localStorage / IndexedDB 持久化（数据本地保存）
                      wv.getSettings().setDomStorageEnabled(true);
                      wv.getSettings().setDatabaseEnabled(true);
                      wv.getSettings().setAllowFileAccess(true);
                      wv.getSettings().setAllowContentAccess(true);
                      wv.addJavascriptInterface(new Object() {

                          /** 旧接口：直接保存到 下载/RP-Hub/ */
                          @JavascriptInterface
                          public void saveBase64(final String data, final String fileName, final String mimeType) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      saveToDownloads(data, fileName, mimeType);
                                  }
                              });
                          }

                          /** 导入：打开文件选择器，选中后回调 window.onRPHubFilePicked(name, mime, base64) */
                          @JavascriptInterface
                          public void pickFile(final String accept) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      startPickFile(accept);
                                  }
                              });
                          }

                          /** 导出：弹出“保存到…”让用户自选目录（SAF，Android 11+ 推荐） */
                          @JavascriptInterface
                          public void saveFileAs(final String fileName, final String mimeType, final String base64Data) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      startSaveAs(fileName, mimeType, base64Data);
                                  }
                              });
                          }
                      }, "AndroidDownloader");

                      wv.setDownloadListener(new android.webkit.DownloadListener() {
                          @Override
                          public void onDownloadStart(final String url, String userAgent,
                                                      String contentDisposition,
                                                      String mimeType, long contentLength) {
                              if (url == null) {
                                  return;
                              }
                              String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              String mt = (mimeType == null || mimeType.isEmpty()) ? "*/*" : mimeType;
                              if (url.startsWith("blob:")) {
                                  fetchBlob(url, fileName, mt);
                              } else if (url.startsWith("data:")) {
                                  int idx = url.indexOf(',');
                                  if (idx >= 0) {
                                      saveToDownloads(url.substring(idx + 1), fileName, mt);
                                  }
                              } else {
                                  downloadByManager(url, fileName, mt);
                              }
                          }
                      });
                  } catch (Exception e) {
                      Toast.makeText(this, "init fail: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              /* ---------------- import (SAF) ---------------- */

              private void startPickFile(String accept) {
                  try {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      String t = (accept == null || accept.trim().isEmpty()) ? "*/*" : accept.trim();
                      i.setType(t);
                      if ("*/*".equals(t)) {
                          i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{
                                  "application/json", "text/plain", "text/*",
                                  "application/zip", "application/octet-stream"
                          });
                      }
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                              | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                      startActivityForResult(Intent.createChooser(i, "选择要导入的文件"), REQ_PICK_FILE);
                  } catch (Exception e) {
                      toast("打开选择器失败: " + e.getMessage());
                  }
              }

              private void handlePickedUri(final Uri uri) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              long size = querySize(uri);
                              if (size > MAX_PICK_BYTES) {
                                  throw new Exception("文件过大（>64MB）");
                              }
                              final String name = queryName(uri);
                              String mt = getContentResolver().getType(uri);
                              final String mime = (mt == null || mt.isEmpty()) ? "*/*" : mt;
                              byte[] bytes = readAll(uri);
                              final String b64 = Base64.encodeToString(bytes, Base64.NO_WRAP);
                              try {
                                  getContentResolver().takePersistableUriPermission(
                                          uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              } catch (Exception ignore) {
                              }
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      deliverToJs(name, mime, b64);
                                  }
                              });
                          } catch (final Exception e) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      toast("读取失败: " + e.getMessage());
                                  }
                              });
                          }
                      }
                  }).start();
              }

              private void deliverToJs(String name, String mime, String b64) {
                  if (webViewRef == null) {
                      return;
                  }
                  String js = "javascript:(function(){try{"
                          + "var d={name:" + jsq(name) + ",mime:" + jsq(mime)
                          + ",base64:" + jsq(b64) + ",uri:null};"
                          + "window.RPHubPickedFile=d;"
                          + "if(typeof window.onRPHubFilePicked==='function'){"
                          + "window.onRPHubFilePicked(d.name,d.mime,d.base64);}"
                          + "try{document.dispatchEvent(new CustomEvent('rphub-file-picked',"
                          + "{detail:d}));}catch(e){}"
                          + "}catch(e){console.log('rphub pick err',e)}})()";
                  webViewRef.evaluateJavascript(js, null);
              }

              /* ---------------- export (SAF) ---------------- */

              private void startSaveAs(String fileName, String mimeType, String base64Data) {
                  pendingSaveName = (fileName == null || fileName.isEmpty())
                          ? "rphub_export.json" : fileName;
                  pendingSaveMime = (mimeType == null || mimeType.isEmpty()) ? "*/*" : mimeType;
                  pendingSaveData = base64Data;
                  try {
                      Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType(pendingSaveMime);
                      i.putExtra(Intent.EXTRA_TITLE, pendingSaveName);
                      i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      startActivityForResult(Intent.createChooser(i, "保存到…"), REQ_SAVE_FILE);
                  } catch (Exception e) {
                      toast("保存失败: " + e.getMessage());
                  }
              }

              private void handleSaveUri(Uri uri) {
                  try {
                      if (pendingSaveData == null || pendingSaveData.isEmpty()) {
                          throw new Exception("数据为空");
                      }
                      byte[] bytes = Base64.decode(pendingSaveData, Base64.DEFAULT);
                      OutputStream os = getContentResolver().openOutputStream(uri);
                      if (os == null) {
                          throw new Exception("无法写入目标位置");
                      }
                      os.write(bytes);
                      os.flush();
                      os.close();
                      toast("已保存: " + pendingSaveName);
                  } catch (Exception e) {
                      toast("保存失败: " + e.getMessage());
                  } finally {
                      pendingSaveData = null;
                  }
              }

              /* ---------------- export (downloads / media store) ---------------- */

              private void saveToDownloads(String base64Data, String fileName, String mimeType) {
                  try {
                      if (base64Data == null || base64Data.length() == 0) {
                          throw new Exception("数据为空");
                      }
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      String name = fileName;
                      if (name == null || name.isEmpty() || name.equals("download") || name.equals("downloadfile")) {
                          String ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mimeType);
                          name = "rphub_" + System.currentTimeMillis() + (ext != null ? "." + ext : ".json");
                      }
                      OutputStream os;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          cv.put(MediaStore.Downloads.MIME_TYPE, mimeType != null ? mimeType : "*/*");
                          cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/RP-Hub");
                          cv.put(MediaStore.Downloads.IS_PENDING, 1);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          if (uri == null) {
                              throw new Exception("无法创建文件");
                          }
                          os = getContentResolver().openOutputStream(uri);
                          cv.clear();
                          cv.put(MediaStore.Downloads.IS_PENDING, 0);
                          getContentResolver().update(uri, cv, null, null);
                      } else {
                          File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "RP-Hub");
                          if (!dir.exists()) {
                              dir.mkdirs();
                          }
                          File f = new File(dir, name);
                          os = new FileOutputStream(f);
                      }
                      os.write(bytes);
                      os.flush();
                      os.close();
                      Toast.makeText(this, "已保存: 下载/RP-Hub/" + name, Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "保存失败: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void downloadByManager(String url, String fileName, String mimeType) {
                  try {
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      req.setMimeType(mimeType);
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "RP-Hub/" + fileName);
                      req.allowScanningByMediaScanner();
                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      if (dm != null) {
                          dm.enqueue(req);
                          Toast.makeText(this, "已开始下载: " + fileName, Toast.LENGTH_SHORT).show();
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "下载失败: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void fetchBlob(final String blobUrl, String fileName, String mimeType) {
                  final String fn = safe(fileName);
                  final String mt = safe(mimeType);
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String js = "javascript:(function(){"
                                      + "var xhr=new XMLHttpRequest();"
                                      + "xhr.open('GET','" + blobUrl + "',true);"
                                      + "xhr.responseType='blob';"
                                      + "xhr.onload=function(){if(xhr.status===200){var r=new FileReader();"
                                      + "r.onloadend=function(){var s=r.result;var i=s.indexOf(',');if(i>=0)s=s.substring(i+1);"
                                      + "if(typeof AndroidDownloader!=='undefined'){AndroidDownloader.saveBase64(s,'" + fn + "','" + mt + "');}};"
                                      + "r.readAsDataURL(xhr.response);}};"
                                      + "xhr.send();})()";
                              webViewRef.evaluateJavascript(js, null);
                          } catch (Exception e) {
                              toast("导出失败: " + e.getMessage());
                          }
                      }
                  });
              }

              /* ---------------- helpers ---------------- */

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode != Activity.RESULT_OK || data == null || data.getData() == null) {
                      return;
                  }
                  if (requestCode == REQ_PICK_FILE) {
                      handlePickedUri(data.getData());
                  } else if (requestCode == REQ_SAVE_FILE) {
                      handleSaveUri(data.getData());
                  }
              }

              private byte[] readAll(Uri uri) throws Exception {
                  InputStream is = getContentResolver().openInputStream(uri);
                  if (is == null) {
                      throw new Exception("无法读取文件");
                  }
                  ByteArrayOutputStream bos = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = is.read(buf)) > 0) {
                      bos.write(buf, 0, n);
                  }
                  is.close();
                  return bos.toByteArray();
              }

              private String queryName(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, null, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (i >= 0) {
                              return c.getString(i);
                          }
                      }
                  } catch (Exception ignore) {
                  } finally {
                      if (c != null) {
                          c.close();
                      }
                  }
                  String p = uri.getLastPathSegment();
                  return p == null ? "import.json" : p;
              }

              private long querySize(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, null, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int i = c.getColumnIndex(OpenableColumns.SIZE);
                          if (i >= 0) {
                              return c.getLong(i);
                          }
                      }
                  } catch (Exception ignore) {
                  } finally {
                      if (c != null) {
                          c.close();
                      }
                  }
                  return -1;
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show();
              }

              private static String safe(String s) {
                  if (s == null) {
                      return "";
                  }
                  return s.replace("\\", "\\\\").replace("'", "\\'");
              }

              private static String jsq(String s) {
                  if (s == null) {
                      return "\"\"";
                  }
                  return "\"" + s.replace("\\", "\\\\")
                          .replace("\"", "\\\"")
                          .replace("\n", "\\n")
                          .replace("\r", "\\r")
                          .replace("'", "\\'") + "\"";
              }
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: rphub-dev-apk-${{ env.DEV_VERSION }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
